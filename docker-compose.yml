name: vialt

services:
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Define VITE_SUPABASE_URL en .env}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Define VITE_SUPABASE_ANON_KEY en .env}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      VIALT_DOMAIN: ${VIALT_DOMAIN:?Define VIALT_DOMAIN en .env}
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
